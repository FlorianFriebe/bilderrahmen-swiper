name: Windows-Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      # VC++-Laufzeit fest einbauen, damit die .exe überall ohne Installation läuft
      RUSTFLAGS: -C target-feature=+crt-static
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Formatierung prüfen
        run: cargo fmt --check
      - name: Code-Prüfung (clippy)
        run: cargo clippy --release --all-targets -- -D warnings
      - name: Tests
        run: cargo test --release
      - name: Bauen
        run: cargo build --release
      - name: Paket schnüren
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/release/bilderrahmen-swiper.exe dist/Bilderrahmen-Swiper.exe
          Copy-Item ANLEITUNG.md dist/ANLEITUNG.md
          Get-Item dist/Bilderrahmen-Swiper.exe | Select-Object Name, Length
      - uses: actions/upload-artifact@v4
        # Nur bei Pull Requests; auf main landet die .exe direkt unter Releases.
        if: github.event_name == 'pull_request'
        continue-on-error: true
        with:
          name: Bilderrahmen-Swiper-Windows
          path: dist/
      - name: Download-Seite aktualisieren
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          # Abschnitt der aktuellen Version aus CHANGELOG.md
          awk -v v="## ${VERSION}" '$0==v{on=1;next} /^## /{on=0} on' CHANGELOG.md > changes.md
          [ -s changes.md ] || echo "- Kleinere Verbesserungen." > changes.md
          sed "s/__VERSION__/${VERSION}/" .github/release-notes.md \
            | awk '/__CHANGES__/{system("cat changes.md"); next} {print}' > notes.md
          # „latest“ ist der feste Link für Download und Update-Prüfung
          gh release delete latest --cleanup-tag -y || true
          gh release create latest dist/Bilderrahmen-Swiper.exe dist/ANLEITUNG.md \
            --target "${{ github.sha }}" \
            --title "Bilderrahmen-Swiper ${VERSION}" \
            --notes-file notes.md
          # jede Version bleibt zusätzlich als eigener Eintrag erhalten
          if ! gh release view "v${VERSION}" >/dev/null 2>&1; then
            gh release create "v${VERSION}" dist/Bilderrahmen-Swiper.exe dist/ANLEITUNG.md \
              --target "${{ github.sha }}" \
              --title "Version ${VERSION}" \
              --notes-file notes.md \
              --latest=false
          fi
