[package]
name = "bilderrahmen-swiper"
version = "3.1.0"
edition = "2021"
description = "Fotos per Swipe für den digitalen Bilderrahmen auswählen und zuschneiden"
license = "MIT"

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "wgpu", "glow", "persistence", "x11", "wayland", "clipboard"] }
egui = "0.37"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "bmp", "tiff", "gif"] }
fast_image_resize = { version = "6", features = ["image"] }
jpeg-encoder = "0.7"
kamadak-exif = "0.6"
rfd = "0.18"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
crossbeam-channel = "0.5"
ab_glyph = "0.2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_Com", "Win32_Graphics_Imaging", "Win32_UI_Shell", "Win32_Storage_FileSystem", "Win32_UI_WindowsAndMessaging", "Win32_System_Threading"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

[profile.dev.package."*"]
opt-level = 2
